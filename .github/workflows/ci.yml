name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@bfe8cc55a7890e3d6672eda6460ef37bfcc70755
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall src

      - name: Test
        run: python -m pytest -q

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

      - name: Mypy
        run: python -m mypy src

      - name: Prove accepted control
        run: repoops fixtures/accepted.json --out artifacts/accepted.json

      - name: Prove rejected out-of-scope control
        run: |
          set +e
          repoops fixtures/rejected-out-of-scope.json --out artifacts/rejected.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/rejected.json").read_text())
          assert payload["outcome"] == "REJECTED"
          assert payload["scope_violations"] == [".github/workflows/ci.yml"]
          PY

      - name: Prove indeterminate stale-state control
        run: |
          set +e
          repoops fixtures/indeterminate-stale-state.json --out artifacts/indeterminate.json
          status=$?
          set -e
          test "$status" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/indeterminate.json").read_text())
          assert payload["outcome"] == "INDETERMINATE"
          PY

      - name: Upload receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repoops-v0-evidence
          path: artifacts/
          if-no-files-found: error
